name: Sync Portfolio from GitHub

on:
  # Triggered by other repos via repository_dispatch
  repository_dispatch:
    types: [portfolio-sync]

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:

  # Also run on any push to THIS portfolio repo (keeps data fresh)
  push:
    branches: [main]
    paths-ignore:
      - "public/github-data.json"   # avoid infinite loop
      - "src/i18n/**"               # avoid infinite loop from AI-generated i18n
      - "scripts/**"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout portfolio repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync GitHub repos → public/github-data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: chandan1708
        run: node scripts/sync-github.mjs

      - name: Update profile README (What I Build + The Stack)
        if: env.GH_PAT != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: node scripts/update-readme.mjs

      # ── AI Agent: README → Portfolio + i18n ──────────────────────────────────
      - name: Setup Python 3.11
        if: env.GROQ_API_KEY != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/ai_agent/requirements.txt

      - name: Install AI agent dependencies
        if: env.GROQ_API_KEY != ''
        run: pip install -r scripts/ai_agent/requirements.txt

      - name: Run AI agent — extract skills + translate
        if: env.GROQ_API_KEY != ''
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: chandan1708
          # For repository_dispatch: use the payload repo; else fall back to the
          # current repo (useful for workflow_dispatch / push from project repos)
          TRIGGER_REPO: ${{ github.event.client_payload.repo || github.repository }}
        run: python scripts/ai_agent/agent.py

      # ── Commit everything ────────────────────────────────────────────────────
      - name: Commit & push all auto-generated files (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/github-data.json
          git add src/i18n/*.json
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "chore: auto-sync portfolio data + i18n [skip ci]"
            git push
          fi
